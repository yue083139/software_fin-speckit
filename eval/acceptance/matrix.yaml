# 驗收矩陣：每一行＝一條使用者可感知行為或隔離邊界 → 守它的門禁或測試。
# 規則見 docs/discipline-precedents.md「提案品質准入六條（正文）」第 6 條。
# 欄位：id / 需求（docs/requirements.md 編號）/ 聲明 / 守門（make 目標或測試路徑）/ 狀態（covered | partial | uncovered）/ 卡
# 兩組各自維護本檔（守門路徑不同），但 id 與聲明兩組一致，便於對照。
rows:
  - id: M-001
    需求: R-01
    聲明: 進場時可選擇老師或學生身分，學生須選定組別並以組別憑證辨識
    守門: server/tests/test_api_skeleton.py；web/src/pages/pages.test.tsx
    狀態: covered
    卡: app-skeleton
  - id: M-002
    需求: R-11
    聲明: 老師切換活動階段後，所有已連線的老師與學生頁面在同一階段
    守門: server/tests/test_api_skeleton.py::test_phase_sync_all_clients；server/tests/test_phases.py
    狀態: covered
    卡: app-skeleton
  - id: M-003
    需求: R-02
    聲明: 匯入任一份合規 Guided Notes 後題數與原檔一致，不依賴固定座標（至少三份版面不同的夾具）
    守門: server/tests/test_guided_notes_parse.py（single、group、variant 三份夾具）；server/tests/test_api_import.py
    狀態: covered
    卡: guided-notes-import
  - id: M-004
    需求: R-09
    聲明: 搶答結束前，任何送往學生端的訊息與回應都不含其他組別的答案
    守門: server/tests/test_isolation.py（WebSocket、送出成功／錯誤回應、他組送出 0 則推播、冒用組別參數、非 ended 各階段、日誌）
    狀態: covered
    卡: buzz-answering
  - id: M-005
    需求: R-10
    聲明: 同一題並發送出時恰一組成功，順位依伺服器接收序且無重號
    守門: server/tests/test_submit.py::test_concurrent_same_question、test_concurrent_same_team_same_question（拿掉鎖必紅）
    狀態: covered
    卡: buzz-answering
  - id: M-006
    需求: R-05
    聲明: 匯出的 Guided Notes 中每題作答格填入搶答成功的答案，其餘格內容與格式不變
    守門: （由 guided-notes-export 卡填）
    狀態: uncovered
    卡: guided-notes-export
  - id: M-007
    需求: R-04
    聲明: 老師畫面即時顯示每題每組的答案、順位、得主與各組得題數
    守門: server/tests/test_results_view.py::test_teacher_board_live；web/src/pages/results.test.tsx
    狀態: covered
    卡: results-view
  - id: M-008
    需求: R-08
    聲明: 學生只在搶答結束後看到每題得主、得主答案、全部組別答案與順位，且與老師畫面一致
    守門: server/tests/test_results_view.py::test_student_results_only_when_ended、test_teacher_and_student_agree
    狀態: covered
    卡: results-view
